<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bid Bot Side Panel</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="panel">
      <h1>Bid Bot</h1>
      <p id="status">Bids are written by the server. This worker opens projects, fills the bid, and submits.</p>

      <section>
        <h2>Worker settings</h2>
        <label for="apiBaseUrl">Server URL</label>
        <input id="apiBaseUrl" type="text" placeholder="https://your-app.vercel.app" />
        <label for="workerId">Worker ID (account label)</label>
        <input id="workerId" type="text" placeholder="acc-1" />
        <label for="workerToken">Worker token</label>
        <input id="workerToken" type="password" placeholder="Same as server WORKER_TOKEN" />
        <label class="check-row">
          <input id="autoSubmit" type="checkbox" />
          Auto click submit button
        </label>
      </section>

      <section>
        <h2>Automation</h2>
        <div class="row">
          <button id="startAutoBtn" type="button">Start Auto</button>
          <button id="stopAutoBtn" type="button">Stop Auto</button>
          <button id="runNowBtn" type="button">Run Now</button>
        </div>
        <p id="autoStatus">Auto mode is off.</p>
      </section>

      <section>
        <h2>Manual test</h2>
        <label for="manualProjectUrl">Freelancer project URL</label>
        <input id="manualProjectUrl" type="text" placeholder="https://www.freelancer.com/projects/..." />
        <div class="row">
          <button id="createBidFromUrlBtn" type="button">Go + Create Bid</button>
        </div>
      </section>

      <section>
        <h2>Last bid</h2>
        <textarea id="draftOutput" rows="12" readonly placeholder="The last bid this worker filled appears here."></textarea>
      </section>
    </main>

    <script src="sidepanel.app.js"></script>
  </body>
</html>
